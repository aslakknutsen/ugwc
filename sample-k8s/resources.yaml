# Gateway API resources for manual testing of ugwc against cluster state (same layout as
# praxis sample-xds/resources.yaml).
#
# GatewayClass uses controller name `ugwc.io/default-controller`, matching the ugwc built-in
# per-gateway Praxis profile (`crates/ugwc/src/implementation_profiles.rs`).
#
# Built-in implementation profile: `ugwc.io/default-controller` maps to per-gateway Praxis with a
# default proxy image; no JSON profiles file is required. To actually create dataplane workloads,
# also set UGWC_DATAPLANE_ENABLE=1 and UGWC_CONTROL_PLANE_XDS_BOOTSTRAP_ADDR (reachable xDS host:port).
#
# ugwc: GatewayClass.spec.controllerName must appear in UGWC_CONTROLLER_NAMES (comma-separated).
# Kubernetes watches are cluster-wide (Gateway, HTTPRoute, EndpointSlice, GatewayClass): grant
# the ugwc identity a ClusterRole with list/watch (and status patch) on those resources across
# all namespaces, not only a namespaced Role.
# With this file unchanged, run ugwc with e.g.:
#
#   UGWC_KUBE_ENABLE=1 \
#   UGWC_CONTROLLER_NAMES=ugwc.io/default-controller \
#   ugwc
#
# If you change spec.controllerName below to match crates/ugwc default (example.com/gateway-controller),
# set UGWC_CONTROLLER_NAMES to that same string instead.
#
# GATEWAY_NAME and GATEWAY_NAMESPACE: replace manually or use envsubst:
#
#   GATEWAY_NAME=ugwc-gw GATEWAY_NAMESPACE=default envsubst < sample-k8s/resources.yaml | kubectl apply -f -
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ugwc-praxis
spec:
  controllerName: ugwc.io/default-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${GATEWAY_NAME}
  namespace: ${GATEWAY_NAMESPACE}
spec:
  gatewayClassName: ugwc-praxis 
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# Sample backend: a simple echo server to verify routing works end-to-end.
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: ${GATEWAY_NAMESPACE}
spec:
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: ${GATEWAY_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/echo-basic:v20251204-v1.4.1
          ports:
            - containerPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: ${GATEWAY_NAMESPACE}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
  hostnames:
    - "echo.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 8080
