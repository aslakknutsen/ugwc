[workspace]
resolver = "2"
members = [
    "crates/ugwc",
    "crates/ugwc-core",
    "crates/ugwc-gwxds",
    "crates/ugwc-k8s",
    "crates/ugwc-xds",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/praxis-proxy/ugwc"

# Versions centralized for parallel lanes and reproducibility.
# k8s-openapi: single Kubernetes minor + gateway types — see crate docs.
[workspace.dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.28"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "timeout"] }
clap = { version = "4", features = ["derive"] }
envy = "0.4"
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
arc-swap = "1"
parking_lot = "0.12"
futures = "0.3"
http = "1"
http-body-util = "0.1"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
xds-api = "0.2"
kube = { version = "3.1", features = ["runtime", "derive"] }
kube-runtime = "3.1"
k8s-openapi = { version = "0.27", features = ["v1_34"] }
gateway-api = { version = "0.21", features = ["experimental"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
strum = { version = "0.26", features = ["derive"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = [
    "http-listener",
] }
prometheus-client = "0.22"
metrics-prometheus-client = "0.0.1"
metrics-process = "2.4"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
tokio-metrics = "0.4"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics", "trace"] }
