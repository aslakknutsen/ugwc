[package]
name = "ugwc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gateway API+ control plane (binary)"
build = "build.rs"

[[bin]]
name = "ugwc"
path = "src/main.rs"

[dependencies]
ugwc-core = { path = "../ugwc-core" }
ugwc-k8s = { path = "../ugwc-k8s" }
ugwc-gwxds = { path = "../ugwc-gwxds" }
ugwc-xds = { path = "../ugwc-xds" }
prost.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
envy.workspace = true
clap.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
arc-swap.workspace = true
metrics.workspace = true
prometheus.workspace = true
prometheus-client.workspace = true
metrics-prometheus-client.workspace = true
http.workspace = true
futures.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
once_cell.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
xds-api.workspace = true
tokio-metrics = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true, features = ["metrics"] }

[features]
default = []
tokio-metrics = ["dep:tokio-metrics"]
otlp-metrics = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
otlp-traces = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
otlp = ["otlp-metrics", "otlp-traces"]
