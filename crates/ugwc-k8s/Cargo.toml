[package]
name = "ugwc-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kube clients, watches, status writers (Gateway API)"

[dependencies]
ugwc-core = { path = "../ugwc-core" }
kube.workspace = true
kube-runtime.workspace = true
k8s-openapi.workspace = true
gateway-api.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true }
minijinja = { version = "2.5", default-features = false, features = ["serde"] }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
http.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
metrics.workspace = true
tower.workspace = true
zeroize.workspace = true
opentelemetry = { workspace = true, optional = true }

[features]
default = []
otel-context = ["dep:opentelemetry"]

[dev-dependencies]
