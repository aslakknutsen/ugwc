{{- $sm := .Values.observability.serviceMonitor }}
{{- $legacy := .Values.serviceMonitor }}
{{- if or $sm.enabled $legacy.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ugwc.fullname" . }}
  labels:
    {{- include "ugwc.labels" . | nindent 4 }}
    {{- $labels := $sm.labels | default $legacy.labels }}
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ugwc.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ $sm.interval | default $legacy.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout | default $legacy.scrapeTimeout }}
{{- end }}
