apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ugwc.fullname" . }}
  labels:
    {{- include "ugwc.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Explicit names: `resources: ["*"]` is not reliably honored for Gateway API CRDs on some clusters.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gateways/status
      - gatewayclasses
      - gatewayclasses/status
      - httproutes
      - httproutes/status
      - grpcroutes
      - grpcroutes/status
      - tcproutes
      - tcproutes/status
      - tlsroutes
      - tlsroutes/status
      - udproutes
      - udproutes/status
      - referencegrants
      - referencegrants/status
      - backendtlspolicies
      - backendtlspolicies/status
      - listenersets 
      - listenersets/status
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources:
      - inferencepools
      - inferencepools/status
    verbs: ["get", "list", "watch", "patch", "update"]
  {{- if .Values.ugwc.dataplaneEnable }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
