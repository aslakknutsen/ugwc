# Default values for ugwc — override for your cluster (controller names, image, TLS, etc.).

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ugwc
  tag: dev
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: "ugwc"

service:
  type: ClusterIP
  ports:
    xds: 18000
    admin: 8080

# Core UGWC_* settings (see docs/operations.md).
ugwc:
  kubeEnable: true
  controllerNames: "ugwc.io/default-controller"
  runProfile: prod
  xdsInsecure: false
  logJson: true
  xdsWire: gwxds
  leaderElection: true
  # When true: sets UGWC_DATAPLANE_ENABLE and adds ClusterRole rules for per-gateway Praxis
  # (Deployments, Services, ServiceAccounts). Enable only when using per-gateway Praxis mode.
  dataplaneEnable: false
  endpointDebounceMs: 200
  reconcileConcurrency: 16
  # If empty, the chart sets bootstrap to <fullname>.<namespace>.svc.cluster.local:<xds port>.
  controlPlaneXdsBootstrapAddr: ""
  # Optional OTLP endpoint (metrics/traces when built with otlp features).
  otlpEndpoint: ""

podAnnotations: {}

# Observability (Prometheus pull on admin port; optional Operator CRs).
observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: true
    labels: {}

# Deprecated: use observability.serviceMonitor (kept for backward-compatible Helm upgrades).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Legacy annotation-based scrape when ServiceMonitor is off.
prometheusAnnotations: false

# Must exceed ugwc shutdown drain (30s) + join (10s); see crates/ugwc/src/run.rs constants.
terminationGracePeriodSeconds: 60

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

resources: {}

# Optional ValidatingAdmissionPolicy to reject ReferenceGrant with wildcard to.name.
# Requires K8s 1.30+ (ValidatingAdmissionPolicy GA).
admissionPolicies:
  rejectWildcardReferenceGrant:
    enabled: false

# Additional container env (literal names, e.g. UGWC_FOO).
extraEnv: []
